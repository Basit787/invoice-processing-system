[project]
name = "invoice-processing-api"
version = "1.0.0"
description = "Invoice processing API with OCR extraction"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy==2.0.36",
    "psycopg2-binary==2.9.10",
    "python-multipart==0.0.20",
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "pytesseract==0.3.13",
    "pillow==11.0.0",
    "pdf2image==1.17.0",
    "python-dateutil==2.9.0.post0",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "ARG",
]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["core", "database", "schemas", "services", "routers"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
